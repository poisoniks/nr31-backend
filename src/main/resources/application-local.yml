spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/nr31db
    username: postgres
    password: password
  jpa:
    show-sql: true
    properties:
      hibernate:
        generate_statistics: true
  flyway:
    locations: classpath:db/migration,classpath:db/migration-local
  mail:
    host: localhost
    port: 1025
    username: 
    password: 
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

springdoc:
  writer-with-default-pretty-printer: true

logging:
  level:
    org.springframework.web: INFO
    org.nr31.backend: DEBUG
    org.hibernate.orm.results: DEBUG
    org.hibernate.stat: DEBUG

jwt:
  secret: sEsXIiICXqeaAiZ+45aWoZhHMXf2hj2dpq0CZQfIGPo=
  expiration: 600000
  refresh:
    expiration: 604800000

app:
  uploads:
    dir: ./uploads
  discord:
    bot-token:
  frontend-url: http://localhost:80
  mail:
    from: noreply@nr31.org
  auth:
    resend-limit-seconds: 120
  metrics-collector:
    url: ${METRICS_COLLECTOR_URL:http://localhost:9100}
